<!doctype html>
<html lang="cs" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VašeSRO | Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    .admin-wrap{ padding: 34px 0; }
    .card{
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow2);
    }
    html[data-theme="light"] .card{
      background: rgba(10,15,30,.03);
      border-color: rgba(10,15,30,.10);
    }
    table{ width:100%; border-collapse: collapse; }
    th,td{ text-align:left; padding: 10px; border-bottom: 1px solid rgba(255,255,255,.10); vertical-align: top; }
    html[data-theme="light"] th, html[data-theme="light"] td{ border-bottom-color: rgba(10,15,30,.10); }
    .small{ color: var(--muted2); font-size: 12px; }
    .msg{ max-width: 560px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="VašeSRO">
        <img class="brand-logo" src="assets/img/logo_vasesro.png" alt="VašeSRO" />
      </a>
      <nav class="nav" aria-label="Hlavní navigace">
        <a href="index.html" class="nav-link">Úvodní strana</a>
        <a href="sluzby.html" class="nav-link">SLUŽBY</a>
        <a href="reference.html" class="nav-link">Reference</a>
        <a href="kontakt.html" class="nav-link">Kontakty</a>
      </nav>
    </div>
  </header>

  <main class="admin-wrap">
    <div class="container">
      <div class="card">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
          <div>
            <h1 style="margin:0;">Admin dashboard</h1>
            <div class="small">Zprávy z kontaktního formuláře</div>
          </div>
          <button class="btn primary" id="refreshBtn" type="button">Obnovit</button>
        </div>

        <div style="overflow:auto; margin-top: 14px;">
          <table id="tbl">
            <thead>
              <tr>
                <th>Vyřízené</th>
                <th>Datum</th>
                <th>Jméno</th>
                <th>Kontakt</th>
                <th>Detaily</th>
                <th>Zpráva</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="small" id="status" style="margin-top:10px;"></div>
      </div>
    </div>
  </main>

  <script>
    async function loadContacts(){
      const status = document.getElementById("status");
      status.textContent = "Načítám…";

      const r = await fetch("/api/admin/contacts");
      const data = await r.json();

      if(!data.ok){
        status.textContent = "Nepodařilo se načíst data.";
        return;
      }

      const tbody = document.querySelector("#tbl tbody");
      tbody.innerHTML = "";

      for(const row of data.rows){
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>
            <label class="small" style="display:flex;align-items:center;gap:8px;">
              <input type="checkbox" class="handledBox" data-id="${row.id}" ${row.handled ? "checked" : ""}>
              <span>${row.handled ? "ano" : "ne"}</span>
            </label>
          </td>

          <td>
            <div>${new Date(row.created_at).toLocaleString()}</div>
            <div class="small">#${row.id}</div>
          </td>

          <td>${escapeHtml(row.name)}</td>

          <td>
            <div><a href="mailto:${escapeAttr(row.email)}">${escapeHtml(row.email)}</a></div>
            <div><a href="tel:${escapeAttr(row.phone)}">${escapeHtml(row.phone)}</a></div>
          </td>

          <td class="small">
            <div><strong>Služba:</strong> ${escapeHtml(row.service || "-")}</div>
            <div><strong>Preferuje:</strong> ${escapeHtml(row.preferred || "-")}</div>
            <div><strong>Předmět:</strong> ${escapeHtml(row.subject || "-")}</div>
            <div><strong>Stránka:</strong> ${escapeHtml(row.page || "-")}</div>
          </td>

          <td class="msg">${escapeHtml(row.message || "")}</td>
        `;
        tbody.appendChild(tr);
      }

      // ✅ This was the missing part: wire up checkbox -> backend toggle
      tbody.querySelectorAll(".handledBox").forEach(cb => {
        cb.addEventListener("change", async (e) => {
          const id = e.target.getAttribute("data-id");
          try {
            const resp = await fetch(`/api/admin/contacts/${id}/toggle`, { method: "POST" });
            const out = await resp.json();
            if (!out.ok) throw new Error("toggle failed");

            // Update label text ("ano"/"ne") next to the checkbox
            const label = e.target.closest("label");
            const span = label ? label.querySelector("span") : null;
            if (span) span.textContent = e.target.checked ? "ano" : "ne";
          } catch (err) {
            // revert checkbox if request fails
            e.target.checked = !e.target.checked;
            alert("Nepodařilo se uložit změnu. Zkuste to prosím znovu.");
          }
        });
      });

      status.textContent = `Načteno: ${data.rows.length} záznamů`;
    }

    function escapeHtml(s){
      return (s ?? "").toString()
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function escapeAttr(s){ return escapeHtml(s); }

    document.getElementById("refreshBtn").addEventListener("click", loadContacts);
    loadContacts();
  </script>
</body>
</html>
